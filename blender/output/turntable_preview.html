<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Turntable Shadow Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f3f3f1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, sans-serif;
    color: #333;
  }
  h1 { font-size: 14px; font-weight: 400; letter-spacing: 2px; text-transform: uppercase; color: #999; margin-bottom: 20px; }
  .viewer {
    width: 540px;
    height: 540px;
    position: relative;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
  }
  .viewer.dragging { cursor: grabbing; }
  .viewer img {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    visibility: hidden;
    pointer-events: none;
  }
  .viewer img.active { visibility: visible; }
  .hint {
    margin-top: 16px;
    font-size: 13px;
    color: #999;
    transition: opacity 0.3s;
  }
  .hint.hidden { opacity: 0; }
  .frame-counter {
    margin-top: 8px;
    font-size: 12px;
    color: #bbb;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<h1>Turntable Shadow Preview</h1>

<div class="viewer" id="viewer"></div>
<div class="hint" id="hint">&#8592; Drag to rotate &#8594;</div>
<div class="frame-counter" id="counter">1 / 18</div>

<script>
(function() {
  const FRAME_COUNT = 18;
  const FOLDER = 'shadow_turntable';
  const PREFIX = 'shadow_turntable2_turn_';
  const DRAG_THRESHOLD = 12;

  const viewer = document.getElementById('viewer');
  const hint = document.getElementById('hint');
  const counter = document.getElementById('counter');
  const frames = [];
  let current = 0;
  let dragging = false;
  let lastX = 0;

  for (let i = 1; i <= FRAME_COUNT; i++) {
    const img = document.createElement('img');
    img.src = `${FOLDER}/${PREFIX}${String(i).padStart(4, '0')}.png`;
    img.alt = `Frame ${i}`;
    if (i === 1) img.classList.add('active');
    frames.push(img);
    viewer.appendChild(img);
  }

  function show(index) {
    index = ((index % FRAME_COUNT) + FRAME_COUNT) % FRAME_COUNT;
    if (index === current) return;
    frames[current].classList.remove('active');
    frames[index].classList.add('active');
    current = index;
    counter.textContent = `${current + 1} / ${FRAME_COUNT}`;
  }

  viewer.addEventListener('mousedown', e => {
    dragging = true;
    lastX = e.clientX;
    viewer.classList.add('dragging');
    hint.classList.add('hidden');
  });

  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const delta = e.clientX - lastX;
    if (Math.abs(delta) >= DRAG_THRESHOLD) {
      show(current + (delta > 0 ? 1 : -1));
      lastX = e.clientX;
    }
  });

  window.addEventListener('mouseup', () => {
    dragging = false;
    viewer.classList.remove('dragging');
  });

  viewer.addEventListener('touchstart', e => {
    dragging = true;
    lastX = e.touches[0].clientX;
    hint.classList.add('hidden');
  }, { passive: true });

  window.addEventListener('touchmove', e => {
    if (!dragging) return;
    const delta = e.touches[0].clientX - lastX;
    if (Math.abs(delta) >= DRAG_THRESHOLD) {
      show(current + (delta > 0 ? 1 : -1));
      lastX = e.touches[0].clientX;
    }
  }, { passive: true });

  window.addEventListener('touchend', () => { dragging = false; });

  viewer.addEventListener('contextmenu', e => e.preventDefault());
  viewer.addEventListener('dragstart', e => e.preventDefault());
})();
</script>
</body>
</html>
